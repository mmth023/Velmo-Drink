<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutraPrime Flash</title>
    <!-- Ícones FontAwesome para o WhatsApp e Sacola -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS DA SUA PÁGINA (COLOQUE OS SEUS AQUI CASO PRECISE) --- */
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* --- ESTILO DO BOTÃO DO WHATSAPP (image_9044a1.png) --- */
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-whatsapp:hover {
            transform: scale(1.03);
            background-color: #20ba5a;
        }
        .btn-whatsapp i {
            margin-right: 10px;
            font-size: 22px;
        }

        /* Container centralizado para testes do botão */
        .wrapper-botao {
            text-align: center;
            padding: 40px 20px;
        }

        /* --- ESTILO DO POP-UP DE PROVA SOCIAL (NOTIFICAÇÃO DE COMPRA) --- */
        .social-proof-popup {
            position: fixed;
            bottom: -100px; /* Começa escondido abaixo da tela */
            left: 20px;
            background-color: #ffffff;
            color: #1a1a1a;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 9999;
            transition: bottom 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            max-width: 320px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .social-proof-popup.active {
            bottom: 20px; /* Sobe para a tela */
        }
        .social-proof-icon {
            background-color: #e6f9ed;
            color: #25D366;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .social-proof-content {
            font-size: 13px;
            line-height: 1.4;
        }
        .social-proof-content b {
            color: #111;
        }
        .social-proof-time {
            font-size: 11px;
            color: #777;
            display: block;
            margin-top: 2px;
        }
        /* Mobile responsivo para o pop-up */
        @media (max-width: 480px) {
            .social-proof-popup {
                left: 10px;
                right: 10px;
                max-width: none;
            }
        }
    </style>
</head>
<body>

    <!-- ================================================================= -->
    <!--  PODE COLOCAR O CONTEÚDO ATUAL DO SEU SITE AQUI DENTRO            -->
    <!-- ================================================================= -->
    
    <div class="wrapper-botao">
        <!-- O Link já codificado com a mensagem que você pediu -->
        <a href="https://wa.me/+55 47 9232-3856?text=Ol%C3%A1%2C%20vim%20pelo%20anuncio%20e%20gostaria%20de%20saber%20mais%20sobre%20o%20produto" target="_blank" class="btn-whatsapp">
            <i class="fab fa-whatsapp"></i> FALAR COM UM ESPECIALISTA
        </a>
    </div>

    <!-- ================================================================= -->



    <!-- ESTRUTURA DO POP-UP (Gerado via JavaScript de forma dinâmica) -->
    <div id="socialProof" class="social-proof-popup">
        <div class="social-proof-icon">
            <i class="fas fa-shopping-bag"></i>
        </div>
        <div class="social-proof-content">
            <span id="socialProofText"><b>Mariana S.</b> de São Paulo/SP acabou de comprar.</span>
            <span id="socialProofTime" class="social-proof-time">há 2 minutos</span>
        </div>
    </div>

    <!-- SCRIPT DA PROVA SOCIAL (Pessoas aleatórias comprando) -->
    <script>
        // Dados que serão sorteados aleatoriamente
        const nomes = ["Ana b.", "Carlos S.", "Mariana T.", "Felipe M.", "Juliana R.", "Marcos V.", "Beatriz P.", "Lucas N.", "Sandra C.", "Rodrigo A.", "Gabriela F.", "Amanda L."];
        const cidades = ["São Paulo/SP", "Rio de Janeiro/RJ", "Belo Horizonte/MG", "Curitiba/PR", "Salvador/BA", "Porto Alegre/RS", "Goiânia/GO", "Campinas/SP", "Brasília/DF", "Recife/PE"];
        const tempos = ["há 1 minuto", "há 3 minutos", "acabou de comprar", "há 5 minutos", "há 32 segundos", "há 2 minutos"];

        const popup = document.getElementById('socialProof');
        const textElement = document.getElementById('socialProofText');
        const timeElement = document.getElementById('socialProofTime');

        function mostrarNotificacao() {
            // Sorteia os dados aleatórios
            const nomeAleatorio = nomes[Math.floor(Math.random() * nomes.length)];
            const cidadeAleatoria = cidades[Math.floor(Math.random() * cidades.length)];
            const tempoAleatorio = tempos[Math.floor(Math.random() * tempos.length)];

            // Atualiza os textos dentro do balão
            textElement.innerHTML = `<b>${nomeAleatorio}</b> de ${cidadeAleatoria} comprou o produto.`;
            timeElement.innerText = tempoAleatorio;

            // Mostra o pop-up na tela
            popup.classList.add('active');

            // Esconde o pop-up de volta após 4 segundos na tela
            setTimeout(() => {
                popup.classList.remove('active');
            }, 4000);
        }

        // Primeira exibição acontece após 3 segundos que a página abriu
        setTimeout(mostrarNotificacao, 3000);

        // Fica repetindo o ciclo de novos compradores a cada 10 segundos
        setInterval(mostrarNotificacao, 10000);
    </script>

</body>
</html>
